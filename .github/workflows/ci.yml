name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run lint
      - run: bun test
        env:
          DATABASE_URL: postgres://unused:unused@localhost:5432/unused
          SITE_URL: http://localhost:3000
