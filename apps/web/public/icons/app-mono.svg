<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="nichedb-title nichedb-desc">
  <title id="nichedb-title">NicheDB</title>
  <desc id="nichedb-desc">An N connects two open data nodes. Sources in, feeds out.</desc>
  <metadata>Design reference: https://w3bs.org/standards/design (coming soon; conformance pending). Editable design brief: brand/prompt.md.</metadata>
  <defs>
    <linearGradient id="nichedb-surface" x1="64" y1="0" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111111"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="nichedb-input" x1="144" y1="144" x2="144" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="nichedb-bridge" x1="156" y1="152" x2="356" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8e8e8"/>
      <stop offset="0.45" stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
    <linearGradient id="nichedb-output" x1="368" y1="144" x2="368" y2="368" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e8e8e8"/>
      <stop offset="1" stop-color="#e8e8e8"/>
    </linearGradient>
  </defs>
  <rect id="nichedb-background" width="512" height="512" rx="112" fill="url(#nichedb-surface)"/>
  <rect id="nichedb-rim" x="1" y="1" width="510" height="510" rx="111" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <g id="nichedb-mark">
    <!-- Two rails and a shared route form the N; the apertures are open ports. -->
    <path d="M144 368V160" stroke="url(#nichedb-input)" stroke-width="64" stroke-linecap="round"/>
    <path d="M368 144V352" stroke="url(#nichedb-output)" stroke-width="64" stroke-linecap="round"/>
    <path d="M144 160L368 352" stroke="#111111" stroke-width="88" stroke-linecap="round"/>
    <path d="M144 160L368 352" stroke="url(#nichedb-bridge)" stroke-width="64" stroke-linecap="round"/>
    <path d="M174 176L350 327" stroke="#ffffff" stroke-opacity="0.26" stroke-width="3" stroke-linecap="round"/>
    <circle cx="144" cy="160" r="14" fill="#111111"/>
    <circle cx="368" cy="352" r="14" fill="#111111"/>
  </g>
</svg>
