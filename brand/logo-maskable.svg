  <path d="M110 158L158 133L207 159L166 180L256 228L346 180L305 159L354 133L402 158V182Q402 190 394 194L268 261Q256 268 244 261L118 194Q110 190 110 182Z" fill="#D88B35"/>
  <path d="M110 158L158 133L207 159L166 180L256 228L346 180L305 159L354 133L402 158L268 229Q256 236 244 229Z" fill="url(#gold)"/>
