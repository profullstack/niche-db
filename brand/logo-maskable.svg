  <ellipse cx="256" cy="159" rx="116" ry="91" fill="url(#aura)"/>
  <path d="M212 132L256 108L300 132V168L256 192L212 168Z" fill="#229B74"/>
  <path d="M212 132L256 108L300 132L256 157Z" fill="url(#core)"/>
  <path d="M212 132L256 157V192L212 168Z" fill="#5EE3A1"/>
  <path d="M256 157L300 132V168L256 192Z" fill="#2ABA87"/>
