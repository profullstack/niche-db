<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NicheDB</title>
  <desc id="desc">Three sculpted amber data layers surrounding a mint-green agent core on an obsidian tile.</desc>
  <metadata id="design-contract"><![CDATA[
{"brand":"NicheDB","asset":"logo","designStandard":{"uri":"https://w3bs.org/standards/design","status":"pending","conformance":"unverified","anticipatedSourceFormats":["SKILL.md","prompt.md"]},"colorTokens":{"surface":"#11181F","data":"#F29932","agent":"#5EE39A"},"editablePaints":["tile","edge","gold","middle","lower","core","aura"],"requirements":{"selfContained":true,"externalFonts":false,"embeddedRaster":false,"scripts":false},"notes":"Future-facing metadata only; reconcile with the published design standard when available. Edit named gradient stops and semantic groups to retheme."}
  ]]></metadata>
  <defs>
    <linearGradient id="tile" x1="64" y1="16" x2="448" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202932"/><stop offset=".5" stop-color="#11181F"/><stop offset="1" stop-color="#090F15"/>
    </linearGradient>
    <linearGradient id="edge" x1="92" y1="24" x2="428" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#59636C" stop-opacity=".55"/><stop offset=".48" stop-color="#26343C" stop-opacity=".1"/><stop offset="1" stop-color="#5EE39A" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="gold" x1="117" y1="172" x2="367" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE3A0"/><stop offset=".48" stop-color="#FFC365"/><stop offset="1" stop-color="#F29932"/>
    </linearGradient>
    <linearGradient id="middle" x1="108" y1="238" x2="398" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7BA60"/><stop offset="1" stop-color="#C97927"/>
    </linearGradient>
    <linearGradient id="lower" x1="108" y1="314" x2="396" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D79442"/><stop offset="1" stop-color="#945126"/>
    </linearGradient>
    <linearGradient id="core" x1="215" y1="120" x2="290" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4FFE0"/><stop offset=".5" stop-color="#74F8B3"/><stop offset="1" stop-color="#37CE94"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(256 159) scale(116 91)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EE39A" stop-opacity=".13"/><stop offset="1" stop-color="#5EE39A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#tile)"/>
<g id="maskable-mark" transform="translate(30.72 30.72) scale(0.88)">
  <g id="data-lower">
  <!-- Lower data tier -->
  <path d="M110 305L244 236Q256 230 268 236L402 305V329Q402 337 394 341L269 407Q256 414 243 407L118 341Q110 337 110 329Z" fill="#713F21"/>
  <path d="M110 305L244 236Q256 230 268 236L402 305L268 376Q256 383 244 376Z" fill="url(#lower)"/>
  <path d="M256 381V411" stroke="#E0A658" stroke-opacity=".3" stroke-width="2"/>
  </g>
  <g id="data-middle">
  <!-- Middle data tier -->
  <path d="M110 231L244 162Q256 156 268 162L402 231V255Q402 263 394 267L269 333Q256 340 243 333L118 267Q110 263 110 255Z" fill="#A86228"/>
