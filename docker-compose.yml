# Local development: the app plus the two datastores it needs.
services:
  app:
    build: .
    ports: ['3000:3000']
    environment:
      NODE_ENV: development
      PORT: 3000
      SITE_URL: http://localhost:3000
      DATABASE_URL: postgres://nichedb:nichedb@db:5432/nichedb
      REDIS_URL: redis://redis:6379
      ROLES: web,worker
    env_file: [.env]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: ['./:/app', '/app/node_modules']

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: nichedb
      POSTGRES_PASSWORD: nichedb
      POSTGRES_DB: nichedb
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nichedb']
      interval: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']

volumes:
  pgdata:
  redisdata:
